
<link href='https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css' rel='stylesheet'>
<app-placement-sidebar></app-placement-sidebar>
<div class="heading" style="background-color: grey;">
    <h2 style="align-items: center; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; font-size: 25px; font-weight: bold;">
      CHAMPIONS
    </h2>
  </div>
  
  <div class="leaderboard">
    <div class="student" *ngFor="let student of studentData">
      <div class="info">
        <div class="marks">
          <h3>{{ student.studentName }}</h3>
          <span>Marks: {{ student.Marks }}</span>
          <span>Rank: {{ student.Rank }}</span>
        </div>
      </div>
      <div class="trophy-container">
        <i class="bx bx-trophy" [ngClass]="{
          'gold': student.Rank === 1,
          'silver': student.Rank === 2,
          'bronze': student.Rank === 3
        }"></i>
      </div>
    </div>
  </div>
