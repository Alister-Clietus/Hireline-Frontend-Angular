<app-student-side-bar></app-student-side-bar>
<div class="heading" style="background-color: grey;">
    <h2 style="align-items: center;font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;font-size: 25px;font-style: bold;">CHAT WITH BOT</h2>
</div>
<div class="chat-container">
  <div class="chat-history">
    <div *ngFor="let chat of chatHistory">
      <div [ngClass]="{'user-message': chat.sender === 'user', 'bot-message': chat.sender === 'bot'}">
        {{ chat.message }}
      </div>
    </div>
  </div>

  <!-- Display initial buttons -->
  <div *ngIf="chatHistory.length === 0" class="response-buttons">
    <button *ngFor="let button of initialButtons" (click)="handleButtonClick(button)" class="response-button">
      {{ button }}
    </button>
  </div>
  
  <!-- Display response array as buttons -->
  <div *ngIf="responseArray.length > 0" class="response-buttons">
    <button *ngFor="let button of responseArray" (click)="handleButtonClick(button)">
      {{ button }}
    </button>
  </div>

  <div class="chat-input">
    <input [(ngModel)]="userInput" placeholder="Type your message..." />
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
